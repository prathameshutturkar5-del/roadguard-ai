services:
  # ── 1. Python FastAPI + YOLOv8n Backend Service ──────────────────────────────
  - type: web
    name: roadguard-ai-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: ALLOW_ORIGIN_REGEX
        value: "^https://.*\\.(vercel\\.app|onrender\\.com)$"
      - key: MAX_IMAGE_SIZE_BYTES
        value: "15728640"
      - key: MAX_VIDEO_SIZE_BYTES
        value: "52428800"

  # ── 2. React + Vite Frontend Static Site ────────────────────────────────────
  - type: static
    name: roadguard-ai-frontend
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
